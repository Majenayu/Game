<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Trebuchet MS, Verdana, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0b2a"/><stop offset="1" stop-color="#1b2457"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.5" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9f43"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="40" y="58" font-size="28" font-weight="900" fill="#fff">Title options (Lanternfall is already used by other games)</text><rect x="40" y="120" width="1200" height="180" rx="22" fill="#000" opacity="0.3" stroke="#ffcf6e" stroke-opacity="0.5"/><text x="80" y="160" font-size="20" font-weight="800" fill="#ffcf6e">1</text><text x="640" y="220" font-size="86" font-weight="900" letter-spacing="4" fill="url(#gold)" stroke="#2a1030" stroke-width="3" paint-order="stroke" text-anchor="middle" filter="url(#glow)">SUNFETCH</text><text x="640" y="260" font-size="22" fill="#fff3d6" text-anchor="middle">Your light is your life. Bring the sun home.</text><text x="640" y="286" font-size="14" fill="#fff3d6" opacity="0.6" text-anchor="middle">No game with this name found in a web search.</text><rect x="40" y="330" width="1200" height="180" rx="22" fill="#000" opacity="0.3" stroke="#ffcf6e" stroke-opacity="0.5"/><text x="80" y="370" font-size="20" font-weight="800" fill="#ffcf6e">2</text><text x="640" y="430" font-size="86" font-weight="900" letter-spacing="4" fill="url(#gold)" stroke="#2a1030" stroke-width="3" paint-order="stroke" text-anchor="middle" filter="url(#glow)">GLOWMOTE</text><text x="640" y="470" font-size="22" fill="#fff3d6" text-anchor="middle">A tiny light against a very big dark.</text><text x="640" y="496" font-size="14" fill="#fff3d6" opacity="0.6" text-anchor="middle">No game with this name found in a web search.</text><rect x="40" y="540" width="1200" height="180" rx="22" fill="#000" opacity="0.3" stroke="#ffcf6e" stroke-opacity="0.5"/><text x="80" y="580" font-size="20" font-weight="800" fill="#ffcf6e">3</text><text x="640" y="640" font-size="86" font-weight="900" letter-spacing="4" fill="url(#gold)" stroke="#2a1030" stroke-width="3" paint-order="stroke" text-anchor="middle" filter="url(#glow)">BRIGHTLING</text><text x="640" y="680" font-size="22" fill="#fff3d6" text-anchor="middle">Burn bright, grow strong, bring the sun home.</text><text x="640" y="706" font-size="14" fill="#fff3d6" opacity="0.6" text-anchor="middle">No game found; also a villain surname in Rainbow Six.</text></svg>